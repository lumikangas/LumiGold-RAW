name: Build Nikon WASM + Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten 3.1.73
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.73

      - name: Cache LibRaw
        uses: actions/cache@v4
        with:
          path: libraw
          key: libraw-0.21.3

      - name: Build WASM
        run: |
          emcc --version
          chmod +x ./build_nikon.sh || true
          mkdir -p wasm
          bash ./build_nikon.sh
          ls -lh wasm/
          SIZE=$(stat -c%s wasm/lumiGoldRaw.wasm)
          echo "WASM size $SIZE"
          if [ "$SIZE" -lt 1000000 ]; then echo "WASM too small"; exit 1; fi

      - name: Commit WASM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add wasm/ || true
          git diff --staged --quiet || git commit -m "Auto-build WASM 128MB"
          git push || true

      - name: Prepare Pages
        run: |
          mkdir -p _site/wasm
          cp wasm/* _site/wasm/ || true
          touch _site/.nojekyll
          cp *.html _site/ 2>/dev/null || true
          if [ -f _site/index_V12_MINIMAL.html ]; then cp _site/index_V12_MINIMAL.html _site/index.html; fi
          ls -lh _site/wasm/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
