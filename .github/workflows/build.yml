name: Build LumiGold RAW WASM + Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Build Nikon WASM (best effort)
        run: |
          chmod +x ./build_nikon.sh || true
          set +e
          ./build_nikon.sh
          STATUS=$?
          set -e
          echo "Build exit code: $STATUS"
          ls -lh wasm/ || echo "wasm dir missing"
          if [ $STATUS -ne 0 ]; then
            echo "::warning::Build failed with $STATUS, but continuing with existing wasm files if present"
            mkdir -p wasm
            # Keep existing files if build failed
            ls -lh wasm/
          fi
          # Ensure we have something to deploy
          test -f wasm/lumiGoldRaw.js || echo "Missing JS - Pages will deploy without wasm"
          test -f wasm/lumiGoldRaw.wasm || echo "Missing WASM - Pages will deploy without wasm"
          # Don't fail job here, let Pages deploy
          exit 0

      - name: Prepare Pages site
        run: |
          mkdir -p _site/wasm
          cp -v wasm/lumiGoldRaw.js _site/wasm/ 2>/dev/null || echo "no JS to copy"
          cp -v wasm/lumiGoldRaw.wasm _site/wasm/ 2>/dev/null || echo "no WASM to copy"
          touch _site/.nojekyll
          # Copy HTML
          cp -v *.html _site/ 2>/dev/null || true
          # Prefer V10 as index if present
          if [ -f "_site/index_V10_SCRIPT_TAG.html" ]; then
            cp -v _site/index_V10_SCRIPT_TAG.html _site/index.html
          fi
          ls -lh _site/
          ls -lh _site/wasm/ || echo "no wasm in _site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-pages:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
