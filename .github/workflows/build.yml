name: Build LumiGold RAW WASM + Deploy Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Build Nikon WASM (auto-downloads LibRaw)
        run: |
          chmod +x ./build_nikon.sh
          ./build_nikon.sh
          ls -lh wasm/
          echo "Verifying outputs..."
          test -f wasm/lumiGoldRaw.js
          test -f wasm/lumiGoldRaw.wasm
          echo "WASM build OK: $(du -h wasm/lumiGoldRaw.wasm | cut -f1) + $(du -h wasm/lumiGoldRaw.js | cut -f1)"

      - name: Prepare Pages site
        run: |
          mkdir -p _site/wasm
          cp -v wasm/lumiGoldRaw.js _site/wasm/
          cp -v wasm/lumiGoldRaw.wasm _site/wasm/
          cp -v .nojekyll _site/ 2>/dev/null || touch _site/.nojekyll
          # Copy HTML - prefer your latest index if it exists
          if [ -f "index_V10_SCRIPT_TAG.html" ]; then
            cp -v index_V10_SCRIPT_TAG.html _site/index.html
          elif [ -f "index.html" ]; then
            cp -v index.html _site/index.html
          fi
          # Copy all HTML for testing
          cp -v *.html _site/ 2>/dev/null || true
          ls -lh _site/wasm/
          ls -lh _site/*.html | head -n20

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumigold-raw-wasm
          path: wasm/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-pages:
    needs: build-wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
