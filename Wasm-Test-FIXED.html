
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>WASM Test Fixed</title></head><body>
<h1>WASM Test Fixed - script tag loader</h1>
<div id="log"></div>
<script>
function log(m){ document.getElementById('log').innerHTML += '<p>'+m+'</p>'; console.log(m); }

async function test(){
  const base = new URL('./wasm/', location.href).href;
  const jsUrl = base + 'lumiGoldRaw.js';
  const wasmUrl = base + 'lumiGoldRaw.wasm';
  log('Testing JS: ' + jsUrl);
  log('Testing WASM: ' + wasmUrl);
  
  try {
    const r1 = await fetch(jsUrl, {method:'HEAD'});
    log('JS HEAD: ' + r1.status + ' type=' + r1.headers.get('content-type') + ' len=' + r1.headers.get('content-length'));
  } catch(e){ log('JS fetch error ' + e); }
  try {
    const r2 = await fetch(wasmUrl, {method:'HEAD'});
    log('WASM HEAD: ' + r2.status + ' type=' + r2.headers.get('content-type') + ' len=' + r2.headers.get('content-length'));
  } catch(e){ log('WASM fetch error ' + e); }

  // Load JS via script tag
  log('Loading JS via script tag...');
  await new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = jsUrl;
    s.onload = ()=>{ log('Script loaded, LumiGoldRawModule=' + (typeof LumiGoldRawModule)); resolve(); };
    s.onerror = (e)=>{ log('Script load error'); reject(e); };
    document.head.appendChild(s);
  });

  try {
    log('Calling LumiGoldRawModule({locateFile...})...');
    const Module = await LumiGoldRawModule({
      locateFile: (p)=>{ const full = base + p; log('locateFile ' + p + ' -> ' + full); return full; }
    });
    log('<span style="color:green">Module ready! _lg_open=' + (typeof Module._lg_open) + ' _lg_get_width=' + (typeof Module._lg_get_width) + '</span>');
    log('Methods: ' + Object.keys(Module).filter(k=>k.startsWith('_lg_')).join(', '));
  } catch(e){
    log('<span style="color:red">Module init failed: ' + e.message + '</span><pre>' + e.stack + '</pre>');
  }
}
test();
</script>
</body></html>
