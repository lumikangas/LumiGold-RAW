
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LumiGold RAW Minimal - Import Test</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:20px}
#drop{border:2px dashed #0f0;padding:40px;text-align:center;margin:20px 0}
#log{white-space:pre-wrap;background:#000;padding:10px;height:300px;overflow:auto}
img{max-width:90%;margin:10px}
</style>
</head><body>
<h1>LumiGold Minimal Import Test V12</h1>
<div id="drop">DROP FILES HERE (JPG, NEF) or <input type="file" id="fileInput" accept=".jpg,.jpeg,.nef,.NEF" multiple></div>
<div id="log"></div>
<div id="preview"></div>
<script>
const logEl = document.getElementById('log');
function log(m){ console.log(m); logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; }

let ModuleCache = null;
async function initWasm(){
  if(ModuleCache) return ModuleCache;
  const base = new URL('./wasm/', location.href).href;
  const jsUrl = base + 'lumiGoldRaw.js';
  log('Loading WASM JS: ' + jsUrl);
  if(typeof LumiGoldRawModule === 'undefined'){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src=jsUrl;
      s.onload=()=>{log('Script loaded, LumiGoldRawModule='+typeof LumiGoldRawModule); res();};
      s.onerror=()=>rej(new Error('Failed load '+jsUrl));
      document.head.appendChild(s);
    });
  }
  log('Calling LumiGoldRawModule...');
  const Mod = await LumiGoldRawModule({locateFile: p=> base + p});
  log('Module ready! _lg_open='+typeof Mod._lg_open);
  ModuleCache = Mod;
  return Mod;
}

async function handleFile(file){
  log('\n=== File: '+file.name+' size='+(file.size/1024/1024).toFixed(2)+'MB type='+file.type+' ===');
  if(/\.nef$/i.test(file.name)){
    log('NEF detected, trying LibRaw...');
    try{
      const Mod = await initWasm();
      const buf = new Uint8Array(await file.arrayBuffer());
      log('Read '+buf.length+' bytes, allocating...');
      const ptr = Mod._malloc(buf.length);
      Mod.HEAPU8.set(buf, ptr);
      log('Calling _lg_open...');
      const handle = Mod._lg_open(ptr, buf.length);
      log('_lg_open returned '+handle);
      if(handle===0){ log('FAILED to open NEF'); Mod._free(ptr); return; }
      const w = Mod._lg_get_width(handle);
      const h = Mod._lg_get_height(handle);
      const black = Mod._lg_get_black(handle);
      const white = Mod._lg_get_white(handle);
      const dmax = Mod._lg_get_data_maximum(handle);
      const lmax = Mod._lg_get_linear_max(handle);
      log(`Decoded ${w}x${h} black=${black} white=${white} dmax=${dmax} lmax=${lmax}`);
      const rgbPtr = Mod._lg_extract_rgb(handle);
      log('RGB float32 ptr='+rgbPtr);
      if(rgbPtr){
        const numPixels = w*h*3;
        const floatData = new Float32Array(Mod.HEAPF32.buffer, rgbPtr, numPixels);
        let min=Infinity,max=-Infinity;
        for(let i=0;i<Math.min(numPixels,100000);i++){ const v=floatData[i]; if(v<min)min=v; if(v>max)max=v; }
        log(`Float32 sample min=${min} max=${max}`);
      }
      Mod._lg_close(handle);
      Mod._free(ptr);
      log('NEF test OK - LibRaw path works!');
    }catch(e){
      log('NEF decode error: '+e.message+'\n'+e.stack);
    }
  } else {
    log('Image file, showing preview...');
    const url = URL.createObjectURL(file);
    const img = document.createElement('img');
    img.src = url;
    document.getElementById('preview').appendChild(img);
    log('Preview added');
  }
}

const drop = document.getElementById('drop');
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.style.background='#222'; });
drop.addEventListener('dragleave', e=>{ drop.style.background=''; });
drop.addEventListener('drop', e=>{
  e.preventDefault(); drop.style.background='';
  log('Drop event, files='+e.dataTransfer.files.length);
  for(const f of e.dataTransfer.files) handleFile(f);
});

document.getElementById('fileInput').addEventListener('change', e=>{
  log('Input change, files='+e.target.files.length);
  for(const f of e.target.files) handleFile(f);
});

log('Ready. WASM status: checking HEAD...');
fetch(new URL('./wasm/lumiGoldRaw.wasm', location.href).href, {method:'HEAD'}).then(r=>log('WASM HEAD '+r.status+' len='+r.headers.get('content-length'))).catch(e=>log('HEAD fail '+e));
log('Now drop a JPG first to test import, then DSC_7782.NEF');
</script>
</body></html>
